name: Static sanity checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure new hook architecture only
        run: |
          grep -R "KHook::Virtual" src/plugin.h
          grep -R "DispatchConCommand" src/plugin.*
          grep -R "!skin" src/plugin.cpp
          grep -R "CreateMenu(MenuType::Html" src/plugin.cpp
          grep -R "AddSubMenu" src/plugin.cpp
          ! grep -R -E "SH_ADD_HOOK|SH_REMOVE_HOOK|SH_MEMBER" src
          grep -R "Schema_DynamicBinding" src/plugin.cpp
          ! grep -R "GetEntityInstance(" src/plugin.cpp
          grep -R "m_EntityList.m_pIdentityChunks" src/plugin.cpp
          grep -R "FindRawClassBinding" src/schema_resolver.cpp
      - name: Validate metadata JSON
        run: python3 -m json.tool plugin-metadata.json >/dev/null
