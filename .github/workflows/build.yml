name: Build CS2 KHook SkinChanger

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    # Build inside Ubuntu 20.04 so the resulting .so targets glibc 2.31
    # instead of the newer glibc shipped by ubuntu-24.04.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 20

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install build packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang lld binutils protobuf-compiler python3 python3-pip python3-venv git ca-certificates zip

      - name: Checkout Metamod and AMBuild
        run: |
          mkdir -p deps
          git clone --depth=1 --recurse-submodules https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git deps/ambuild

      - name: Install AMBuild
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ./deps/ambuild
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Checkout matching CS2 HL2SDK via Metamod helper
        run: |
          (cd deps && ./metamod-source/support/checkout-deps.sh -s cs2)
          test -d deps/hl2sdk-cs2

      - name: Sync current Source2/KHook build scripts from Metamod
        run: |
          bash tools/sync-buildscripts.sh "$GITHUB_WORKSPACE/deps/metamod-source"
          test -f deps/metamod-source/third_party/khook/include/khook.hpp
          grep -q "third_party.*khook" AMBuildScript

      - name: Configure
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py \
            --enable-optimize \
            -s cs2 \
            --targets=x86_64 \
            --mms_path="$GITHUB_WORKSPACE/deps/metamod-source" \
            --hl2sdk-root="$GITHUB_WORKSPACE/deps" \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/deps/metamod-source/hl2sdk-manifests"

      - name: Build
        run: |
          cd build
          ambuild

      - name: Verify ABI compatibility
        shell: bash
        run: |
          set -euo pipefail
          SO=build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so
          test -f "$SO"

          echo "Verifying v0.3 built-in menu binary does not depend on CS2Menus/libcurl:"
          if readelf -d "$SO" | grep -Ei 'cs2menus|libcurl'; then
            echo "ERROR: unexpected external menu/curl dependency"
            exit 1
          fi

          echo "Dynamic dependencies:"
          readelf -d "$SO" | grep NEEDED || true

          echo "Required GLIBC symbol versions:"
          readelf --version-info "$SO" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu || true

          MAX_GLIBC=$(readelf --version-info "$SO" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "Highest required GLIBC: ${MAX_GLIBC:-none}"
          if [ -n "${MAX_GLIBC:-}" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" '2.31' | sort -V | tail -n1)" != '2.31' ]; then
            echo "ERROR: binary requires GLIBC $MAX_GLIBC, newer than compatibility target 2.31"
            exit 1
          fi

          echo "Required GLIBCXX symbol versions:"
          readelf --version-info "$SO" | grep -oE 'GLIBCXX_[0-9]+(\.[0-9]+)*' | sort -Vu || true

          echo "Checking for unresolved hl2sdk entity-system calls:"
          if nm -D --undefined-only "$SO" | c++filt | grep -E 'C(Entity|GameEntity)System::(GetEntityIdentity|GetEntityInstance)'; then
            echo "ERROR: plugin still contains unresolved CEntitySystem entity lookup symbols"
            exit 1
          fi

      - name: Verify package
        run: |
          test -f build/package/cs2/addons/metamod/khook_skinchanger.vdf
          test -f build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so
          mkdir -p build/package/cs2/addons/khook_skinchanger/configs
          cp configs/README.txt build/package/cs2/addons/khook_skinchanger/configs/README.txt
          cp README.md build/package/cs2/addons/khook_skinchanger/README.md
          cp LICENSE build/package/cs2/addons/khook_skinchanger/LICENSE
          (cd build/package && zip -r "$GITHUB_WORKSPACE/khook_skinchanger-linux.zip" cs2)
          sha256sum khook_skinchanger-linux.zip | tee khook_skinchanger-linux.zip.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: khook-skinchanger-linux
          path: |
            khook_skinchanger-linux.zip
            khook_skinchanger-linux.zip.sha256
          if-no-files-found: error
          retention-days: 30
