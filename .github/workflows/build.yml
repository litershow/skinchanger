name: Build CS2 KHook SkinChanger

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    # GitHub provides the Docker host, but compilation itself happens inside
    # Valve's Steam Runtime 3 (sniper), matching CS2's linuxsteamrt64 ABI.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install build packages in Steam Runtime Sniper
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang lld binutils protobuf-compiler \
            python3 python3-pip python3-venv git zip ca-certificates
          rm -rf /var/lib/apt/lists/*
          echo "Build glibc: $(ldd --version | head -n1)"

      - name: Checkout Metamod and AMBuild
        shell: bash
        run: |
          mkdir -p deps
          git clone --depth=1 --recurse-submodules https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git deps/ambuild

      - name: Install AMBuild
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ./deps/ambuild
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Checkout matching CS2 HL2SDK via Metamod helper
        shell: bash
        run: |
          (cd deps && bash ./metamod-source/support/checkout-deps.sh -s cs2)
          test -d deps/hl2sdk-cs2

      - name: Sync current Source2/KHook build scripts from Metamod
        shell: bash
        run: |
          bash tools/sync-buildscripts.sh "$GITHUB_WORKSPACE/deps/metamod-source"
          test -f deps/metamod-source/third_party/khook/include/khook.hpp
          grep -q "third_party.*khook" AMBuildScript

      - name: Configure
        shell: bash
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py \
            --enable-optimize \
            -s cs2 \
            --targets=x86_64 \
            --mms_path="$GITHUB_WORKSPACE/deps/metamod-source" \
            --hl2sdk-root="$GITHUB_WORKSPACE/deps" \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/deps/metamod-source/hl2sdk-manifests"

      - name: Build
        shell: bash
        run: |
          cd build
          ambuild

      - name: Verify Steam Runtime ABI
        shell: bash
        run: |
          SO="build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so"
          test -f "$SO"

          echo "=== ELF ==="
          file "$SO"
          echo "=== required GLIBC symbols ==="
          readelf --version-info "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | uniq || true
          echo "=== required GLIBCXX symbols ==="
          readelf --version-info "$SO" | grep -oE 'GLIBCXX_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -Vu | uniq || true

          # CS2 linuxsteamrt64 uses Steam Runtime 3 "sniper" (glibc 2.31).
          # Fail CI if a future runner/toolchain accidentally introduces a newer dependency.
          python3 - <<'PY'
          import re, subprocess, sys
          so = 'build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so'
          out = subprocess.check_output(['readelf', '--version-info', so], text=True, errors='replace')
          versions = [(int(a), int(b)) for a, b in re.findall(r'GLIBC_(\d+)\.(\d+)', out)]
          newest = max(versions, default=(0, 0))
          print(f'Highest required GLIBC: {newest[0]}.{newest[1]}')
          if newest > (2, 31):
              print('ERROR: binary is newer than Steam Runtime Sniper (glibc 2.31)', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Package
        shell: bash
        run: |
          test -f build/package/cs2/addons/metamod/khook_skinchanger.vdf
          test -f build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so
          mkdir -p build/package/cs2/addons/khook_skinchanger/configs
          cp configs/README.txt build/package/cs2/addons/khook_skinchanger/configs/README.txt
          cp README.md build/package/cs2/addons/khook_skinchanger/README.md
          cp LICENSE build/package/cs2/addons/khook_skinchanger/LICENSE
          (cd build/package && zip -r "$GITHUB_WORKSPACE/khook_skinchanger-linux.zip" cs2)
          sha256sum khook_skinchanger-linux.zip | tee khook_skinchanger-linux.zip.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: khook-skinchanger-linux-steamrt-sniper
          path: |
            khook_skinchanger-linux.zip
            khook_skinchanger-linux.zip.sha256
          if-no-files-found: error
          retention-days: 30
