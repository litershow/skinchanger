name: Build CS2 KHook SkinChanger

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install build packages
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail

          apt_work="$(mktemp -d)"
          chmod 0755 "$apt_work"

          mkdir -p \
            "$apt_work/sources.list.d" \
            "$apt_work/lists/partial"

          printf '%s\n' \
            'deb [arch=amd64 check-valid-until=no] http://archive.debian.org/debian bullseye main' \
            > "$apt_work/sources.list"

          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_work/sources.list"
            -o "Dir::Etc::sourceparts=$apt_work/sources.list.d"
            -o "Dir::State::lists=$apt_work/lists"
            -o "APT::Default-Release=bullseye"
          )

          apt-get "${apt_options[@]}" update

          apt-get "${apt_options[@]}" install \
            -y --no-install-recommends \
            ca-certificates \
            git \
            zip \
            build-essential \
            clang \
            lld \
            binutils \
            protobuf-compiler \
            python3 \
            python3-pip

      - name: Checkout Metamod and AMBuild
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p deps

          git clone --depth=1 --recurse-submodules \
            https://github.com/alliedmodders/metamod-source.git \
            deps/metamod-source

          git clone --depth=1 \
            https://github.com/alliedmodders/ambuild.git \
            deps/ambuild

      - name: Install AMBuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            ./deps/ambuild

      - name: Checkout matching CS2 HL2SDK
        shell: bash
        run: |
          set -euxo pipefail

          cd deps
          ./metamod-source/support/checkout-deps.sh -s cs2
          test -d hl2sdk-cs2

      - name: Sync current Source2 and KHook build scripts
        shell: bash
        run: |
          set -euxo pipefail

          bash tools/sync-buildscripts.sh \
            "$GITHUB_WORKSPACE/deps/metamod-source"

          test -f deps/metamod-source/third_party/khook/include/khook.hpp
          grep -q "third_party.*khook" AMBuildScript

      - name: Prepare CS2Menus headers
        shell: bash
        env:
          CS2MENUS_REF: "1.5.8"
        run: |
          set -euxo pipefail

          cs2menus_dir="$GITHUB_WORKSPACE/deps/cs2menus"

          git clone --depth=1 --branch "$CS2MENUS_REF" \
            https://github.com/FemboyKZ/mm-cs2menus.git \
            "$cs2menus_dir"

          cs2menus_include_dir="$cs2menus_dir/src/public"
          cs2menus_header="$cs2menus_include_dir/ics2menus.h"

          test -s "$cs2menus_header"

          if ! grep -Fq 'ICS2Menus003' "$cs2menus_header"; then
            echo "::error::The downloaded header does not declare ICS2Menus003."
            exit 1
          fi

          # Add the header directory for subsequent Configure and Build steps.
          printf 'CPLUS_INCLUDE_PATH=%s\n' \
            "$cs2menus_include_dir${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" \
            >> "$GITHUB_ENV"

          echo "CS2Menus header: $cs2menus_header"
          git -C "$cs2menus_dir" rev-parse HEAD

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build
          cd build

          python3 ../configure.py \
            --enable-optimize \
            -s cs2 \
            --targets=x86_64 \
            --mms_path="$GITHUB_WORKSPACE/deps/metamod-source" \
            --hl2sdk-root="$GITHUB_WORKSPACE/deps" \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/deps/metamod-source/hl2sdk-manifests"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          cd build
          ambuild

      - name: Verify GLIBC compatibility
        shell: bash
        run: |
          set -euxo pipefail

          plugin_so="build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so"
          test -f "$plugin_so"

          highest_glibc="$(readelf --version-info "$plugin_so" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sort -Vu \
            | tail -n 1)"

          test -n "$highest_glibc"

          echo "Highest required GLIBC: ${highest_glibc#GLIBC_}"

          highest_allowed="$(printf '%s\n' 'GLIBC_2.31' "$highest_glibc" \
            | sort -V \
            | tail -n 1)"

          if [ "$highest_allowed" != 'GLIBC_2.31' ]; then
            echo "ERROR: plugin requires $highest_glibc; maximum allowed is GLIBC_2.31"
            exit 1
          fi

      - name: Package plugin
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/package/cs2/addons/metamod/khook_skinchanger.vdf
          test -f build/package/cs2/addons/khook_skinchanger/bin/linuxsteamrt64/khook_skinchanger.so

          mkdir -p build/package/cs2/addons/khook_skinchanger/configs

          cp configs/README.txt \
            build/package/cs2/addons/khook_skinchanger/configs/README.txt

          cp README.md \
            build/package/cs2/addons/khook_skinchanger/README.md

          cp LICENSE \
            build/package/cs2/addons/khook_skinchanger/LICENSE

          cd build/package
          zip -r "$GITHUB_WORKSPACE/khook_skinchanger-linux.zip" cs2

          cd "$GITHUB_WORKSPACE"
          sha256sum khook_skinchanger-linux.zip \
            | tee khook_skinchanger-linux.zip.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: khook-skinchanger-linux-steamrt-sniper
          path: |
            khook_skinchanger-linux.zip
            khook_skinchanger-linux.zip.sha256
          if-no-files-found: error
          retention-days: 30